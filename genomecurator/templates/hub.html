{% extends "base.html" %}{% block body %}
<div class="pagehead"><h2>분석 허브</h2><span class="mut">데이터셋을 고르면 그 데이터셋의 모든 분석과 결과 화면을 한곳에서 엽니다</span></div>
<div class="card" style="font-size:13px"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end">
 <label>바이러스<br><select id="wsel" onchange="location.href='/hub?watch='+this.value">{% for w in watches %}<option value="{{ w.id }}" {{ 'selected' if w.id == wid }}>{{ w.name }}</option>{% endfor %}</select></label>
 <label>데이터셋<br><select id="dsel" onchange="pick(this.value)" style="min-width:260px"></select></label>
 <a href="/datasets?watch={{ wid }}"><button type="button">데이터셋 만들기·편집</button></a>
 <a id="runlink" href="/nextstrain"><button type="button" class="p">분석 실행하기</button></a></div>
 <div class="mut" id="dinfo" style="margin-top:8px"></div></div>
<div class="card" style="font-size:12.5px;margin-top:-4px"><b>이 바이러스의 구현 상태</b> {% for s in support %}<span class="bdg {{ s.level }}" title="{{ s.note }}">{{ s.label }} {{ s.text }}</span> {% endfor %}<div class="mut" style="margin-top:4px">{% for s in support if s.level != 'done' %}<div><b>{{ s.label }}</b>: {{ s.note }}</div>{% endfor %}</div></div>
<div id="root"><div class="card mut">데이터셋을 고르세요.</div></div>
<script>
const WID={{ wid }},START={{ dsid }};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOOL={nextstrain:'Nextstrain 트리',squirrel:'Squirrel',clock:'분자시계·tMRCA',mutprofile:'변이 프로파일'};
const GROUPS=[['변이','어떤 변이가 있는가',[['snipit','변이 그림','유전체마다 한 줄, 전체를 한눈에 · lineage 띠, APOBEC3 점, 유전자 트랙'],['heatmap','변이 히트맵','lineage·서브클러스터별 변이 빈도, 검색·유전자 이동으로 자세히'],['pca','변이 묶음','함께 나타나는 변이 묶음과 유전체 PCA']]],
 ['계통·전파','언제, 어디서 퍼졌는가',[['spread','전파 타임라인·지도','lineage·대표 변이 × 나라 × 시간, 세계 지도 애니메이션, 라인차트']]],
 ['통계·가설','무엇을 뜻하는가',[['concordance','호출 일치도','이 실행의 변이를 snippy·lofreq(독립 호출)와 맞춰 봅니다 · 도구가 어긋나는 위치, 가리지 않음'],['insight','변이 분석','APOBEC3 변이의 전달, APOBEC3 대 배경 변이, lineage 시그니처'],['outbreak','유행 분석','서브클러스터, 크기 분포, APOBEC3 누적, 유전자 hotspot'],['novel','신규 변이','정의에 없는 변이를 공유하는 새 계통군 후보와 발견 곡선']]]];
let DS=[],INFO=null,RID=0;
async function init(){DS=await (await fetch('/api/datasets?watch='+WID)).json();const sel=document.getElementById('dsel');sel.innerHTML=DS.length?DS.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join(''):'<option value="">(데이터셋 없음)</option>';
 if(!DS.length){document.getElementById('root').innerHTML='<div class="card">이 바이러스에는 아직 데이터셋이 없습니다. <a href="/datasets?watch='+WID+'">데이터셋을 먼저 만드세요</a>.</div>';return}
 const mem=(GC.get('ctx',null)||{}).dataset,id=START&&DS.some(d=>d.id===START)?START:(mem&&DS.some(d=>d.id===mem)?mem:DS[0].id);sel.value=id;pick(id)}
async function pick(id){if(!id)return;INFO=await (await fetch('/api/datasets/'+id+'/nextstrain')).json();document.getElementById('runlink').href='/nextstrain?dataset='+id;gcCtx({dataset:+id,name:(DS.find(d=>d.id==id)||{}).name});if(INFO.error){document.getElementById('root').innerHTML='<div class="card" style="color:var(--bad)">'+esc(INFO.error)+'</div>';return}
 const runs=INFO.runs,mp=runs.filter(r=>r.tool==='mutprofile'&&r.status==='done');RID=mp.length?mp[0].id:0;render()}
function badge(c,r){if(!c)return '';return c.current?'<span style="color:var(--ok)">● 현재 데이터와 같은 입력</span>':(c.same_members&&c.same_content===false?'<span style="color:var(--bad)">● 같은 id인데 내용이 바뀜</span>':(!c.same_members?'<span style="color:var(--warn)">● 데이터가 바뀜 (+'+c.added+' / −'+c.removed+')</span>':(!c.same_params?'<span style="color:var(--warn)">● 설정이 다름</span>':'<span class="mut">● 확인 불가</span>')))}
function render(){const d=INFO.dataset,runs=INFO.runs;document.getElementById('dinfo').innerHTML='규칙: '+esc(d.summary)+' · 지금 멤버 <b>'+INFO.members.toLocaleString()+'건</b>'+(d.include_private?' (🔒 비공개 포함)':'')+' · <a href="/dataset/'+d.id+'">목록 보기</a>';
 let h='<h3>① 분석 실행 현황</h3><div style="display:flex;gap:12px;flex-wrap:wrap">'+['nextstrain','squirrel','clock','mutprofile'].map(t=>{const rs=runs.filter(r=>r.tool===t&&!r.align_only),last=rs.find(r=>r.status==='done'),bad=rs.find(r=>r.status==='error'&&(!last||r.id>last.id));
  return '<div class="card" style="min-width:250px;flex:1"><b>'+TOOL[t]+'</b>'+(last?'<div style="margin-top:4px;font-size:13px">'+badge(last.cmp,last)+'</div><div class="mut" style="font-size:12px">'+esc(last.started.replace('T',' '))+' · 공개 '+(last.n_public||0).toLocaleString()+(last.n_private?' · 🔒 '+last.n_private:'')+'</div>'+(t==='squirrel'&&last.url?'<div style="margin-top:6px"><a href="'+esc(last.url)+'" target="_blank" rel="noopener">보고서 열기</a></div>':'')+(t==='nextstrain'?'<div style="margin-top:6px"><a href="/nextstrain?dataset='+d.id+'">Auspice로 열기</a></div>':''):'<div class="mut" style="margin-top:4px">아직 없음 — <a href="/nextstrain?dataset='+d.id+'">실행하기</a></div>')+(bad?'<div style="color:var(--bad);font-size:12px;margin-top:4px">최근 실패: '+esc(String(bad.error||'').slice(0,80))+'</div>':'')+'</div>'}).join('')+'</div>';
 const mp=runs.filter(r=>r.tool==='mutprofile'&&r.status==='done');
 h+='<h3 style="margin-top:20px">② 결과 보기 <span class="mut" style="font-size:12.5px;font-weight:400">변이 프로파일 결과를 바탕으로 합니다</span></h3>';
 if(!mp.length)h+='<div class="card">이 데이터셋의 <b>변이 프로파일</b> 실행이 아직 없습니다. <a href="/nextstrain?dataset='+d.id+'">Nextstrain 탭의 <i>변이 프로파일</i> 패널에서 실행</a>하면 아래 결과 화면이 모두 열립니다.</div>';
 else{h+='<div style="font-size:13px;margin-bottom:8px">보는 실행: <select onchange="RID=+this.value;render()">'+mp.map(r=>'<option value="'+r.id+'" '+(r.id===RID?'selected':'')+'>'+esc(r.started.replace('T',' '))+' · 참조 '+esc((r.versions&&r.versions.tools&&r.versions.tools.reference)||'')+'</option>').join('')+'</select> <span class="mut">'+badge((mp.find(r=>r.id===RID)||{}).cmp)+'</span></div>';
  h+=GROUPS.map(g=>'<div style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:6px">'+g[0]+' <span class="mut" style="font-weight:400;font-size:12.5px">— '+g[1]+'</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px">'+g[2].map(c=>'<a href="/analysis/'+RID+'/'+c[0]+'" style="text-decoration:none;color:inherit"><div class="card" style="margin:0;height:100%;border-top:3px solid var(--acc)"><div style="font-weight:600;color:var(--acc)">'+c[1]+'</div><div class="mut" style="font-size:12.5px;margin-top:3px">'+c[2]+'</div></div></a>').join('')+'</div></div>').join('')}
 h+='<h3 style="margin-top:20px">③ 이 밖에</h3><div style="font-size:13px"><a href="/dataset/'+d.id+'">데이터셋 보기</a> · <a href="/export?dataset='+d.id+'">내보내기</a> · <a href="/pathoplexus?watch='+WID+'">Pathoplexus 제출 준비</a> · <a href="/nextstrain?dataset='+d.id+'">실행 설정과 전체 이력</a></div>';
 document.getElementById('root').innerHTML=h}
init();
</script>
{% endblock %}
