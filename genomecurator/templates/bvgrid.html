<style>
:root{--bvg:#76a72b}
.bvh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.bvh .ico{width:26px;height:26px;background:var(--bvg);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700}
.bvh small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.crumb{font-size:12.5px;color:var(--mut)}.crumb b{color:var(--bvg)}.crumb em{font-style:normal;color:var(--mut)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:4px 0 0}
.tabs a{padding:6px 14px;font-size:13px;color:var(--fg);text-decoration:none;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs a.on{background:var(--card);border-color:var(--bd);border-top:3px solid var(--bvg);font-weight:600}
.tool{display:flex;gap:2px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-top:0;padding:6px 8px}
.tbn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 12px;cursor:pointer;color:var(--acc);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:0;background:none}
.tbn i{font-style:normal;font-size:20px;line-height:22px}.tbn:hover{color:var(--bvg)}
.kw{display:flex;flex-direction:column;font-size:10px;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;margin:0 10px}.kw input{width:260px}
.wrap{display:flex;background:var(--card);border:1px solid var(--bd);border-top:0}
#fp{display:flex;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-top:0;font-size:12.5px}
#fp .fg{flex:0 0 184px;max-height:96px;overflow-y:auto;padding:4px 8px;border-right:1px solid var(--bd)}#fp .fg>b{display:block;position:sticky;top:-4px;background:var(--card);font-size:11px;color:var(--mut);text-transform:uppercase;margin:0 0 2px;padding:1px 0}
#rail{flex:none;width:22px;background:var(--bvg);display:flex;align-items:flex-start;justify-content:center;padding-top:8px}#rail button{background:none;border:0;color:#fff;font-size:16px;font-weight:700;padding:2px;cursor:pointer;line-height:1}
.fv{display:flex;justify-content:space-between;gap:6px;padding:0 4px;line-height:1.35;border-radius:2px;cursor:pointer}.fv:hover{background:var(--hover)}.fv.on{background:var(--bvg);color:#fff}
.fv span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fv .n{opacity:.7}.more{font-size:11.5px;color:var(--acc);cursor:pointer;padding:2px 4px}
.gm{flex:1;min-width:0}.chips{display:flex;gap:6px;flex-wrap:wrap;padding:5px 8px;border-bottom:1px solid var(--bd)}
.chip{background:var(--chip);border-radius:2px;padding:0 4px 0 8px;font-size:12px}.chip a{cursor:pointer;margin-left:4px;padding:0 4px}
.gs{overflow:auto;max-height:66vh}
.gt{width:100%;border:0;font-size:12.5px;white-space:nowrap}.gt th{position:sticky;top:0;background:var(--th);cursor:pointer;user-select:none;border-bottom:2px solid var(--bd);border-right:1px solid var(--bd);padding:5px 8px;font-size:12px;z-index:1}
.gt th.s::after{content:" ▲";font-size:9px}.gt th.s.d::after{content:" ▼";font-size:9px}
.gt td{padding:3px 8px;border-bottom:1px solid var(--bd);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.gt tbody tr{cursor:pointer}.gt tbody tr:hover{background:var(--hover)}.gt tr.cur{background:var(--chip)}
.gt td.nm{color:var(--acc);font-weight:500}.Complete{color:var(--ok)}
#rp{width:var(--rpw,320px);min-width:200px;flex:none;border-left:1px solid var(--bd);background:var(--stripe);font-size:12.5px;max-height:72vh;overflow:auto}
#rz{flex:none;width:7px;cursor:col-resize;background:var(--bd);position:relative;touch-action:none}#rz::after{content:'';position:absolute;left:2px;top:50%;height:36px;width:3px;margin-top:-18px;border-left:1px solid var(--mut);border-right:1px solid var(--mut);opacity:.6}#rz:hover,#rz.drag{background:var(--bvg)}#rz:hover::after,#rz.drag::after{border-color:#fff;opacity:1}
#rp h5{margin:0;padding:8px 12px;font-size:13px;background:var(--bvg);color:#fff}
#rp .hint{margin:12px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:3px;color:var(--mut)}
#rp table{border:0;font-size:12px}#rp td{padding:3px 10px;border-bottom:1px solid var(--bd);vertical-align:top;word-break:break-word}#rp td:first-child{color:var(--mut);width:42%}
.src{font-size:10px;border-radius:8px;padding:0 6px;margin-left:4px;color:#fff}.src.manual{background:#c0762f}.src.pathoplexus{background:#8a6bbd}.src.ncbi{background:#2f79b5}.src.bvbrc{background:#3a9d6e}
.acts{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pg{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--bd);border-top:0;font-size:12.5px}
.pg .pn{cursor:pointer;color:var(--acc);padding:0 4px}.pg .pn.on{font-weight:700;color:var(--fg);text-decoration:underline}
.cm{position:absolute;background:var(--card);border:1px solid var(--bd);padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:5;display:none;max-height:300px;overflow:auto;text-align:left;text-transform:none;letter-spacing:0}
.cm label{display:block;font-size:12.5px;color:var(--fg)}.cm.open{display:block}
@media(max-width:1000px){ #rp,#rail,#rz{display:none}}
.gt td.chg{background:rgba(210,153,34,.22)}.gt td.chg i{display:block;font-size:11px;text-decoration:line-through;color:var(--bad);font-style:normal}
.Near{color:var(--warn)}.new,.approved,.applied{color:var(--ok)}.removed,.rejected{color:var(--bad)}.changed,.hold,.pending{color:var(--warn)}
#rp s.old{color:var(--bad)}
#gbox.max{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:8px 10px}
#gbox.max .wrap{flex:1;min-height:0}#gbox.max .gm{display:flex;flex-direction:column}
#gbox.max .gs{flex:1;max-height:none}#gbox.max #rp{max-height:none;height:100%}

.ppx{border-top:1px solid var(--bd);margin-top:6px}.ppx h6{margin:0;padding:6px 12px;font-size:12px;background:var(--th);text-transform:uppercase;letter-spacing:.04em}
.ppx .pb{padding:6px 12px;font-size:12px}.ppx .btns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.ppx .btns a,.ppx .btns button{font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--acc);text-decoration:none;cursor:pointer}
.ppx table{margin:0 0 6px}.ppx .mut-g{margin:3px 0;line-height:1.7}.ppx .mut-g b{color:var(--fg)}
.ppx .chip2{display:inline-block;background:var(--chip);border-radius:3px;padding:0 5px;margin:1px 2px 1px 0;font-family:Consolas,monospace;font-size:11.5px}
#ppxdrawer{position:fixed;top:0;right:0;bottom:0;width:min(920px,82vw);z-index:70;background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.3);display:none;flex-direction:column}
#ppxdrawer.on{display:flex}#ppxdrawer .dh{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--bvg);color:#fff;font-weight:600}
#ppxdrawer .dh a,#ppxdrawer .dh button{color:#fff;background:none;border:1px solid #fff8;border-radius:3px;padding:2px 8px;font-size:12px;text-decoration:none;cursor:pointer}
#ppxdrawer iframe{flex:1;border:0;width:100%;background:#fff}#ppxdrawer .dn{padding:6px 12px;font-size:12px;color:var(--mut)}
</style>
<div id="gbox">
<div class="tool">
 <button class="tbn" onclick="G.tsv(false)"><i>⬇</i>Download</button>
 <label class="kw">Keywords<input id="gq" placeholder="검색어 입력"></label>
 <span style="position:relative"><button class="tbn" onclick="document.getElementById('cm').classList.toggle('open')"><i>▥</i>Select Columns</button><div class="cm" id="cm"></div></span>
 <button class="tbn" onclick="G.togglePanel()"><i>⛃</i>Filters</button>
 <button class="tbn" onclick="G.clear()"><i>✕</i>Clear</button>
 <button class="tbn" id="b_max" onclick="G.max()" title="표를 전체 화면으로 (Esc로 복귀)"><i>⤢</i>Maximize</button>
 {{ toolbar_extra|default('')|safe }}
 <span style="flex:1"></span><span class="mut" id="gcount" style="font-size:12px"></span></div>
<div id="fp"></div>
<div class="wrap">
 <div class="gm"><div class="chips" id="chips" style="display:none"></div><div class="gs"><table class="gt"><thead id="gh"></thead><tbody id="gb"></tbody></table></div></div>
 <div id="rz" title="드래그해서 상세 패널 너비 조절 · 더블클릭: 기본 너비"></div><aside id="rp"></aside><div id="rail"><button type="button" id="b_rp" title="Genome detail 숨기기/보이기" onclick="G.toggleRp()">»</button></div></div>
<div class="pg"><span id="gres"></span><span style="flex:1"></span><span class="pn" onclick="G.page(-1)">◀</span><span id="gpages"></span><span class="pn" onclick="G.page(1)">▶</span>
 <select id="gps" onchange="G.size(this.value)"><option>25</option><option>50</option><option selected>100</option><option>250</option></select> 행</div>
</div>
<form id="ff" method="post" action="/genomes/fasta" style="display:none"><input name="ids" id="fids"></form>
<script type="application/json" id="gdata">{{ data|tojson }}</script>
<script>
const G=(()=>{
const D=JSON.parse(document.getElementById('gdata').textContent),rows=D.rows,cols=D.cols,facets=D.facets;
rows.forEach(r=>{r.collection_year=(r.collection_date||'').slice(0,4)||'(없음)'});
const st={f:{},q:'',sort:null,dir:1,pg:0,ps:100,vis:new Set(cols.filter(c=>c.on).map(c=>c.k)),cur:null,sel:new Set(),panel:true,rpHide:(()=>{try{return localStorage.getItem('gcRp')==='0'}catch(e){return false}})()};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=(r,k)=>{const v=r[k];return v===null||v===undefined||v===''?'(없음)':String(v)};
const label=k=>(cols.find(c=>c.k===k)||{label:k}).label;
const LINKS={genbank:a=>'https://www.ncbi.nlm.nih.gov/nuccore/'+a,sra_accession:a=>'https://www.ncbi.nlm.nih.gov/sra/'+a,
 bioproject_accession:a=>'https://www.ncbi.nlm.nih.gov/bioproject/?term='+a,biosample_accession:a=>'https://www.ncbi.nlm.nih.gov/biosample/'+a};
const cell=(k,r)=>{const v=r[k];if(!LINKS[k]||!v)return esc(v);
 return String(v).split(/[;,]\s*/).filter(Boolean).map(a=>`<a href="${esc(LINKS[k](a.replace(/\.\d+$/,'')))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(a)}</a>`).join(', ')};
function match(r,skip){for(const k in st.f){if(k===skip||!st.f[k].size)continue;if(!st.f[k].has(val(r,k)))return false}
 if(st.q){const q=st.q.toLowerCase();if(!cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)))return false}return true}
let view=[];
function filt(){view=rows.filter(r=>match(r));if(st.sort){const k=st.sort,d=st.dir;view.sort((a,b)=>{let x=a[k],y=b[k];if(x==null||x==='')return 1;if(y==null||y==='')return -1;
 const nx=parseFloat(x),ny=parseFloat(y);if(!isNaN(nx)&&!isNaN(ny)&&String(nx)==String(x))return(nx-ny)*d;return String(x).localeCompare(String(y))*d})}}
function facetsHtml(){let h='';for(const f of facets){const cnt={};rows.forEach(r=>{if(match(r,f.k)){const v=val(r,f.k);cnt[v]=(cnt[v]||0)+1}});
 const act=st.f[f.k]||new Set();act.forEach(v=>{if(!(v in cnt))cnt[v]=0});const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));if(!e.length)continue;
 const sh=e;
 h+=`<div class="fg"><b>${esc(f.label)}</b>`+sh.map(([v,n])=>`<div class="fv ${act.has(v)?'on':''}" data-k="${esc(f.k)}" data-v="${esc(v)}"><span title="${esc(v)}">${esc(v)}</span><span class="n">${n}</span></div>`).join('')
 +'</div>'}
 return h}

/* ---- Pathoplexus: variants straight from the public LAPIS API (CORS-enabled) + page viewer ---- */
const PPXB='https://lapis.pathoplexus.org',ppxCache={};
async function ppxFetch(slug,acc){if(ppxCache[acc])return ppxCache[acc];
 const base=`${PPXB}/${slug}/sample`,q='accessionVersion='+encodeURIComponent(acc),j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
 const [d,nm,am,ni]=await Promise.all([j(`${base}/details?${q}&fields=clade,lineage,totalSnps,totalDeletedNucs,totalInsertedNucs,totalAmbiguousNucs,totalUnknownNucs,totalFrameShifts,totalStopCodons,frameShifts,completeness`),
  j(`${base}/nucleotideMutations?${q}&minProportion=0`),j(`${base}/aminoAcidMutations?${q}&minProportion=0`),j(`${base}/nucleotideInsertions?${q}`)]);
 return ppxCache[acc]={d:(d.data||[])[0]||{},nm:nm.data||[],am:am.data||[],ni:ni.data||[]}}
function ppxHtml(x){
 const d=x.d,f=(k,l)=>d[k]!==undefined&&d[k]!==null&&d[k]!==''?`<tr><td>${l}</td><td>${esc(d[k])}</td></tr>`:'';
 let h='<table>'+f('clade','Clade')+f('lineage','Lineage')+f('totalSnps','SNPs')+f('totalDeletedNucs','Deleted nt')+f('totalInsertedNucs','Inserted nt')+f('totalAmbiguousNucs','Ambiguous (N)')+f('totalFrameShifts','Frame shifts')+f('totalStopCodons','Stop codons')
  +(d.completeness!=null?`<tr><td>Completeness</td><td>${(100*d.completeness).toFixed(1)}%</td></tr>`:'')+'</table>';
 const subs=x.nm.filter(m=>m.mutationTo!=='-'&&m.mutationTo!=='N'&&m.mutationFrom!=='N'),dels=x.nm.filter(m=>m.mutationTo==='-').map(m=>m.position).sort((a,b)=>a-b);
 const ranges=[];for(const p of dels){const l=ranges[ranges.length-1];if(l&&p===l[1]+1)l[1]=p;else ranges.push([p,p])}
 if(!x.nm.length&&!x.am.length)return h+'<div class="mut">이 서열은 참조 서열 대비 변이 정보가 없습니다 (정렬되지 않았거나 지원하지 않는 organism).</div>';
 const chips=(a,n)=>a.slice(0,n).map(t=>`<span class="chip2">${esc(t)}</span>`).join('')+(a.length>n?` <span class="mut">…외 ${a.length-n}개</span>`:'');
 const genes={};x.am.forEach(m=>{(genes[m.sequenceName||'?']=genes[m.sequenceName||'?']||[]).push(m.mutationFrom+m.position+m.mutationTo)});
 h+=`<div class="mut-g"><b>아미노산 변이 ${x.am.length}개</b></div>`+Object.entries(genes).sort().slice(0,40).map(([g,a])=>`<div class="mut-g"><b>${esc(g)}</b> ${chips(a,12)}</div>`).join('')+(Object.keys(genes).length>40?'<div class="mut">…유전자 일부만 표시</div>':'');
 h+=`<div class="mut-g"><b>염기 치환 ${subs.length}개</b> ${chips(subs.map(m=>m.mutationFrom+m.position+m.mutationTo),40)}</div>`;
 h+=`<div class="mut-g"><b>결실 ${dels.length}nt (${ranges.length}구간)</b> ${chips(ranges.map(r=>r[0]===r[1]?r[0]:r[0]+'–'+r[1]+' ('+(r[1]-r[0]+1)+'nt)'),12)}</div>`;
 if(x.ni.length)h+=`<div class="mut-g"><b>삽입 ${x.ni.length}개</b> ${chips(x.ni.map(i=>'ins_'+i.position+':'+(i.insertedSymbols||'').slice(0,20)+((i.insertedSymbols||'').length>20?'…':'')),8)}</div>`;
 return h}
function ppxSection(slug,acc){return `<div class="ppx"><h6>Pathoplexus · ${esc(acc)}</h6><div class="pb"><div class="btns"><a href="https://pathoplexus.org/seq/${esc(acc)}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>`
 +`<button type="button" onclick="ppxOpen('${esc(acc)}')">페이지 보기 ▸</button></div><div id="ppxbox" data-acc="${esc(acc)}"><span class="mut">변이 정보 불러오는 중…</span></div></div></div>`}
async function ppxLoad(slug,acc){const box=document.getElementById('ppxbox');if(!box)return;
 try{const x=await ppxFetch(slug,acc);const b=document.getElementById('ppxbox');if(b&&b.dataset.acc===acc)b.innerHTML=ppxHtml(x)}
 catch(e){const b=document.getElementById('ppxbox');if(b&&b.dataset.acc===acc)b.innerHTML='<span class="mut">Pathoplexus에서 변이 정보를 가져오지 못했습니다 ('+esc(e.message||e)+')</span>'}}
function ppxOpen(acc){let d=document.getElementById('ppxdrawer');
 if(!d){d=document.createElement('div');d.id='ppxdrawer';document.body.appendChild(d)}
 const url='https://pathoplexus.org/seq/'+encodeURIComponent(acc);
 d.innerHTML=`<div class="dh"><span style="flex:1">Pathoplexus · ${esc(acc)}</span><a href="${url}" target="_blank" rel="noopener">새 탭 ↗</a><button type="button" onclick="document.getElementById('ppxdrawer').classList.remove('on')">닫기 ✕</button></div>`
  +`<div class="dn">Pathoplexus 사이트를 그대로 불러옵니다. 로딩이 느리거나 비어 있으면 &quot;새 탭&quot;을 사용하세요.</div><iframe src="${url}" referrerpolicy="no-referrer" loading="lazy"></iframe>`;
 d.classList.add('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=document.getElementById('ppxdrawer');if(d&&d.classList.contains('on'))d.classList.remove('on')}});

window.ppxOpen=ppxOpen;
function rp(){const el=$('rp');$('rz').style.display=st.rpHide?'none':'';$('b_rp').textContent=st.rpHide?'«':'»';if(st.rpHide){el.style.display='none';return}el.style.display='';
 const n=st.sel.size;
 if(!n&&!st.cur){el.innerHTML='<h5>Nothing selected.</h5><div class="hint">표에서 행을 클릭하면 상세 정보와 값의 출처(Pathoplexus / NCBI / BV-BRC)가 여기에 표시됩니다. 체크박스로 여러 건을 선택하면 일괄 다운로드할 수 있습니다.</div>';return}
 let h=`<h5>${n?n+' genome'+(n>1?'s':'')+' selected':'Genome detail'}</h5>`;
 if(n)h+=`<div class="acts"><button onclick="G.tsv(true)">선택 항목 TSV 다운로드</button><button onclick="G.fasta()">선택 항목 FASTA 다운로드</button></div>`;
 const r=st.cur;if(r&&window.rpExtra)h+=window.rpExtra(r);if(r&&r._diff&&r.kind==='changed'){h+='<table><tr><td colspan=2><b>변경 내용</b></td></tr>'+Object.entries(r._diff).map(([k,v])=>`<tr><td>${esc(label(k))}</td><td><s class="old">${esc(v[0]??'∅')}</s> → <b>${esc(v[1]??'∅')}</b></td></tr>`).join('')+'</table>'}
 if(r){const keys=cols.map(c=>c.k).concat(['taxon_id','taxon_lineage_names','accession','sequence_md5','sequence_hash','pathoplexus_accession','submitter','publication','segment','genotype','subtype']);
  h+='<table>'+[...new Set(keys)].filter(k=>r[k]!==null&&r[k]!==undefined&&r[k]!=='').map(k=>{const s=r._prov&&r._prov[k];
   return `<tr><td>${esc(label(k))}</td><td>${cell(k,r)}${s?`<span class="src ${s}">${s}</span>`:''}</td></tr>`}).join('')+'</table>';
  if(D.ppx&&r.pathoplexus_accession)h+=ppxSection(D.ppx,r.pathoplexus_accession)}
 el.innerHTML=h;if(r&&D.ppx&&r.pathoplexus_accession)ppxLoad(D.ppx,r.pathoplexus_accession);if(r&&window.rpAfter)window.rpAfter(r)}
function table(){const vc=cols.filter(c=>st.vis.has(c.k));
 $('gh').innerHTML='<tr><th><input type="checkbox" id="gall"></th>'+vc.map(c=>`<th data-s="${c.k}" class="${st.sort===c.k?'s '+(st.dir<0?'d':''):''}">${esc(c.label)}</th>`).join('')+'</tr>';
 const pages=Math.max(1,Math.ceil(view.length/st.ps));st.pg=Math.min(st.pg,pages-1);const sl=view.slice(st.pg*st.ps,(st.pg+1)*st.ps);
 $('gb').innerHTML=sl.map(r=>`<tr data-id="${r.id}" class="${st.cur&&st.cur.id===r.id?'cur':''}"><td><input type="checkbox" ${st.sel.has(r.id)?'checked':''}></td>`
  +vc.map(c=>{const d=r.kind==='changed'&&r._diff&&r._diff[c.k];if(d)return `<td class="chg" title="이전 값 → 새 값"><i>${esc(d[0]??'∅')}</i>${esc(d[1]??'∅')}</td>`;return `<td class="${c.k==='genome_name'?'nm':''} ${(c.k==='genome_status'||c.cls)?esc(r[c.k]):''}" title="${esc(r[c.k])}">${cell(c.k,r)}</td>`}).join('')+'</tr>').join('');
 const a=view.length?st.pg*st.ps+1:0,b=Math.min(view.length,(st.pg+1)*st.ps);
 $('gres').textContent=`${a.toLocaleString()} - ${b.toLocaleString()} of ${view.length.toLocaleString()} results`;
 $('gcount').textContent=view.length!==rows.length?`${view.length.toLocaleString()} / ${rows.length.toLocaleString()} 필터됨`:'';

<script>
(()=>{const box=document.getElementById('gbox'),rz=document.getElementById('rz'),rp=document.getElementById('rp'),KEY='gcRpW';
 const clamp=w=>Math.max(200,Math.min(w,Math.floor(box.clientWidth*0.75)));
 const set=w=>{box.style.setProperty('--rpw',clamp(w)+'px')};
 try{const w=parseInt(localStorage.getItem(KEY));if(w)set(w)}catch(e){}
 let sx=0,sw=0;
 rz.addEventListener('pointerdown',e=>{sx=e.clientX;sw=rp.getBoundingClientRect().width;rz.setPointerCapture(e.pointerId);rz.classList.add('drag');document.body.style.userSelect='none';e.preventDefault()});
 rz.addEventListener('pointermove',e=>{if(rz.classList.contains('drag'))set(sw+(sx-e.clientX))});
 const end=e=>{if(!rz.classList.contains('drag'))return;rz.classList.remove('drag');document.body.style.userSelect='';
  try{localStorage.setItem(KEY,String(Math.round(rp.getBoundingClientRect().width)))}catch(x){}};
 rz.addEventListener('pointerup',end);rz.addEventListener('pointercancel',end);
 rz.addEventListener('dblclick',()=>{box.style.removeProperty('--rpw');try{localStorage.removeItem(KEY)}catch(e){}});
})();
</script>
