<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenomeCurator</title>
<style>
:root{--bg:#fafafa;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--bd:#e2e2e6;--acc:#1f6feb;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececf0;--mut:#9a9aa2;--card:#202024;--bd:#33333a;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
nav{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
nav a{color:var(--fg);text-decoration:none}nav b{margin-right:8px}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:20px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd)}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.pill{border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid var(--bd)}
.READY,.applied,.approved,.new{color:var(--ok)}.BLOCKED,.rejected,.removed{color:var(--bad)}.hold,.changed,.pending{color:var(--warn)}
button,input{font:inherit;padding:4px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.msg{padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:12px}
.mut{color:var(--mut)} .old{text-decoration:line-through;color:var(--bad)} .new{color:var(--ok)}
code{font-size:12px}
@media(max-width:700px){main{padding:12px}table{font-size:12px}}
</style></head><body>
<nav><b>GenomeCurator</b><a href="/">큐레이션 {% if badge %}<span class="badge">{{ badge }}</span>{% endif %}</a><a href="/genomes">로컬 유전체</a><a href="/history">이력</a></nav>
<main>{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}{% block body %}{% endblock %}</main></body></html>
