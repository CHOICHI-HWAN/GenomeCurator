{% extends "base.html" %}{% block body %}
{% set view='insight' %}{% include "_anav.html" %}
<div class="pagehead"><h2>변이 분석 <span class="mut" style="font-size:14px;font-weight:400">APOBEC3 전파 · 신규 변이 · lineage 시그니처</span></h2><span class="mut">{{ run.name }}</span></div>
<div class="card" style="font-size:13px"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end"><label title="서열에서 N·모호 염기가 차지하는 비율이 이보다 큰 유전체는 이 분석에서 뺍니다. N 구간은 SNP을 부를 수 없어 변이 수가 실제보다 적게 나오므로, 개수를 비교하는 분석은 낮출수록 믿을 만합니다">N 비율 상한<br><select id="mn"><option value="0.05">5% 이하</option><option value="0.01">1% 이하</option><option value="0.2">20% 이하</option><option value="1">제한 없음</option></select></label><button type="button" class="p" onclick="load()">다시 계산</button><span class="mut" id="nf"></span></div></div>
<div id="root"><div class="card mut">계산하는 중… (처음에는 NC_063383.1 기준 정렬 때문에 1~2분 걸릴 수 있습니다)</div></div>
<script>
const RID={{ run.id }},RUNREF={{ runref|tojson }};const MENU_OK=()=>D&&D.emerging&&D.emerging.reference&&RUNREF&&String(D.emerging.reference).split(' ')[0]===String(RUNREF).split(' ')[0];
document.addEventListener('click',ev=>chipMenu(ev));document.addEventListener('contextmenu',ev=>chipMenu(ev));
function chipMenu(ev){const c=ev.target.closest&&ev.target.closest('.mchip');if(!c||!MENU_OK())return;const m=/^([ACGT])(\d+)([ACGT])/.exec(c.dataset.label);if(!m)return;gcMutMenu(ev,RID,{ref:m[1],pos:+m[2],alt:m[3]},'insight')}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=x=>x==null?'-':(x*100).toFixed(1)+'%',pv=p=>p==null?'-':(p<0.001?'p < 0.001':'p = '+p.toFixed(3));
let D=null;
// inline graphics for tables: a bar (value / max), a stacked bar (parts), a sparkline (series)
const bar=(v,mx,col,txt)=>'<div style="display:flex;align-items:center;gap:6px;min-width:90px"><div style="flex:1;height:9px;background:#eef0f2;border-radius:2px"><div style="height:9px;width:'+(mx?Math.max(0,Math.min(100,v/mx*100)):0).toFixed(1)+'%;background:'+(col||'#4e79a7')+';border-radius:2px"></div></div><span style="min-width:30px;text-align:right">'+(txt??v)+'</span></div>';
const stk=(parts,w)=>{const t=parts.reduce((s,p)=>s+p[0],0)||1;return '<div title="'+parts.map(p=>p[2]+' '+p[0]).join(' / ')+'" style="display:flex;height:9px;width:'+(w||90)+'px;background:#eef0f2;border-radius:2px;overflow:hidden">'+parts.map(p=>'<span style="background:'+p[1]+';width:'+(p[0]/t*100)+'%"></span>').join('')+'</div>'};
const spark=(vals,col,w,h)=>{w=w||110;h=h||22;const mx=Math.max(1,...vals),bw=w/Math.max(1,vals.length);return '<svg width="'+w+'" height="'+h+'" style="vertical-align:middle">'+vals.map((v,i)=>v?'<rect x="'+(i*bw).toFixed(1)+'" y="'+(h-v/mx*(h-2)).toFixed(1)+'" width="'+Math.max(1,bw-0.5).toFixed(1)+'" height="'+(v/mx*(h-2)).toFixed(1)+'" fill="'+(col||'#4e79a7')+'"/>':'').join('')+'</svg>'};

async function load(){const q=new URLSearchParams({max_n:document.getElementById('mn')?.value||0.05,window_days:document.getElementById('wd')?.value||120,min_carriers:document.getElementById('mc')?.value||3,skip_apobec:document.getElementById('sa')?.checked?1:0});
 const r=await fetch('/api/analyses/'+RID+'/insight?'+q);D=await r.json();if(D.error){document.getElementById('root').innerHTML='<div class="card" style="color:var(--bad)">'+esc(D.error)+'</div>';return}render()}
function render(){const A=D.apobec_sites,B=D.apobec_branches,E=D.emerging,S=D.signatures;let h='';document.getElementById('nf').textContent=(D.n_filtered?'유전체 '+D.n_filtered.kept.toLocaleString()+'건 / '+D.n_filtered.of.toLocaleString()+'건 사용 (N 비율 '+(D.n_filtered.max_n==null||D.n_filtered.max_n>=1?'제한 없음':'≤ '+(D.n_filtered.max_n*100)+'%')+') · ITR 양 끝은 마스킹':'');
 h+='<h3>1. APOBEC3형 변이도 전파되는가?</h3><div class="help">합의(consensus) 서열로 볼 수 있는 것은 <b>두 유전체 이상이 가진(=전달된) 변이</b>와 <b>한 유전체에만 있는 변이</b>의 차이입니다. APOBEC3형 변이가 전달되지 않는 숙주 내 사건이라면 한 유전체에만 있는 변이에 몰려야 합니다. 두 방법으로 비교합니다. <b>환자 내부의 소수 변이(검체 부위마다 조금씩 다른 변이)는 합의 서열에서 보이지 않으므로</b> 이 분석으로는 답할 수 없습니다 — 같은 환자의 여러 검체나 원시 리드가 있어야 합니다.</div><div class="caut">⚠ 합의 서열은 환자 안의 소수 변이를 보지 못합니다. N 비율 상한을 켠 채 해석하세요.</div>';
 h+='<div class="card"><b>① 위치 기준</b> (참조 '+esc(E.reference)+'와 다른 위치, 같은 변이를 가진 유전체 수로 분류)<table style="margin-top:6px"><tr><th>가진 유전체 수</th><th>위치 수</th><th>APOBEC3형 위치</th><th>비율</th></tr>'+A.classes.map(c=>'<tr><td>'+c.carriers+(c.carriers==='>50'?' <span class="mut">(참조와의 고정 차이)</span>':'')+'</td><td>'+c.sites.toLocaleString()+'</td><td>'+c.apobec_sites.toLocaleString()+'</td><td>'+bar(c.apobec_share_sites||0,1,'#d6249f',pc(c.apobec_share_sites))+'</td></tr>').join('')+'</table>'
  +'<div style="margin-top:6px">한 유전체에만: <b>'+pc(A.share_private)+'</b> ('+A.private.sites+'곳) · 2~50개 유전체가 공유: <b>'+pc(A.share_shared)+'</b> ('+A.shared.sites+'곳) · <span class="mut">'+(A.test.chi2==null?'검정 불가':'χ²='+A.test.chi2+', '+pv(A.test.p)+', 오즈비 '+A.test.odds_ratio)+'</span></div></div>';
 if(B)h+='<div class="card"><b>② 가지 기준</b> (Nextstrain 트리 <code>'+esc(B.tree.slice(-24))+'</code>: 끝 가지 = 한 유전체에만, 안쪽 가지 = 둘 이상이 물려받음)<table style="margin-top:6px"><tr><th></th><th>변이 수</th><th>APOBEC3형</th><th>비율</th></tr><tr><td>끝 가지 (그 유전체만)</td><td>'+B.terminal.n+'</td><td>'+B.terminal.apobec+'</td><td>'+pc(B.share_terminal)+'</td></tr><tr><td>안쪽 가지 (물려받음)</td><td>'+B.internal.n+'</td><td>'+B.internal.apobec+'</td><td>'+pc(B.share_internal)+'</td></tr></table><div style="margin-top:6px"><span class="mut">'+(B.test.chi2==null?'검정 불가':'χ²='+B.test.chi2+', '+pv(B.test.p)+', 오즈비(끝/안쪽) '+B.test.odds_ratio)+'</span></div></div>';
 if(B&&B.variants)h+='<div class="card"><b>② 가지 기준의 강건성</b> <span class="mut">(같은 변이가 여러 가지에 되풀이되면 부풀려지므로 더 엄격한 계산을 함께 봅니다 · 여러 가지에 나타난 변이 '+B.homoplastic_mutations+'개 / 전체 '+B.mutations+'개)</span><table style="margin-top:6px"><tr><th>계산</th><th>끝 가지</th><th>안쪽 가지</th><th>검정</th></tr>'+B.variants.map(v=>'<tr><td>'+esc(v.name)+'</td><td>'+v.terminal.apobec+' / '+v.terminal.n+' ('+pc(v.share_terminal)+')</td><td>'+v.internal.apobec+' / '+v.internal.n+' ('+pc(v.share_internal)+')</td><td class="mut">'+(v.test.chi2==null?'-':'χ²='+v.test.chi2+', '+pv(v.test.p))+'</td></tr>').join('')+'</table></div>';
 else h+='<div class="card mut">② 가지 기준은 이 데이터셋의 Nextstrain 분석이 있어야 계산됩니다.</div>';
 const verdict=[];if(B&&B.test.p!=null)verdict.push(B.share_internal>B.share_terminal?'가지 기준: 물려받은(안쪽 가지) 변이의 <b>'+pc(B.share_internal)+'</b>가 APOBEC3형입니다 → APOBEC3형 변이는 실제로 <b>전달됩니다</b>. 끝 가지(그 유전체만)의 비율('+pc(B.share_terminal)+')이 더 낮은 것은, 끝 가지에 시퀀싱·조립 오류와 숙주 내 변이 같은 비(非)APOBEC3 변이가 더 섞이기 때문일 수 있습니다. 그래도 끝 가지의 과반이 APOBEC3형이라, 같은 편집이 개인 안에서도 계속 일어난다는 뜻이기도 합니다.':'가지 기준: 끝 가지의 APOBEC3형 비율('+pc(B.share_terminal)+')이 안쪽 가지('+pc(B.share_internal)+')보다 높습니다 → 최근/숙주 내 편집이 많다는 뜻일 수 있습니다.');
 if(A.test.p!=null)verdict.push(A.test.p<0.05?'위치 기준에서도 차이가 있습니다.':'위치 기준에서는 한 유전체에만 있는 변이와 공유 변이의 비율 차이가 유의하지 않습니다.');
 h+='<div class="help"><b>해석</b>: '+verdict.join(' ')+'<br><span class="mut">어느 쪽이든 한계가 있습니다: 반복적으로 같은 위치에 생기는 변이(hot spot)는 공유되어도 전달이 아닐 수 있고, 끝 가지에는 시퀀싱·조립 오류가 섞이며, 맥락은 참조 서열(위치 기준) 또는 트리 뿌리 서열(가지 기준)에서 가져옵니다.</span></div>';
 h+='<h3>2. 신규(정의에 없는) 변이 후보</h3><div class="card" style="font-size:13px"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end"><label>최근 기준(일)<br><input id="wd" type="number" value="'+E.window_days+'" style="width:70px"></label><label>최소 유전체 수<br><input id="mc" type="number" value="'+E.min_carriers+'" style="width:70px"></label><label><input type="checkbox" id="sa"> APOBEC3형 제외</label><button type="button" onclick="load()">다시 계산</button><span class="mut">데이터의 가장 최근 날짜 '+esc(E.newest)+' · lineage 정의 '+(E.definitions?'반영됨(정의 변이는 제외)':'<b style="color:var(--bad)">없음</b> — 전파 타임라인에서 정의를 받으세요')+'</span></div></div>';
 h+='<div class="mut" style="margin:6px 0">함께 움직이는 변이 묶음(같은 유전체들이 가진 변이 2개 이상) <b>'+E.n_clusters+'</b>개 — 여러 유전체/나라에 걸치면 새 lineage 후보입니다. 확정은 계통수가 필요합니다.</div>';
 h+=E.clusters.length?'<table><tr><th>변이 묶음</th><th>유전자</th><th>유전체</th><th>나라</th><th>lineage</th><th>첫 ~ 마지막</th><th>APOBEC3형</th></tr>'+E.clusters.slice(0,25).map(c=>'<tr><td style="font-size:12px">'+c.mutations.map(m=>'<span class="mchip" data-label="'+esc(m)+'" style="cursor:'+(MENU_OK()?'pointer':'default')+'" title="'+(MENU_OK()?'클릭 또는 우클릭: 전파 타임라인·변이 히트맵에서 보기':'')+'">'+esc(m)+'</span>').join(' ')+'</td><td>'+esc(c.genes.join(', '))+'</td><td>'+bar(c.n,Math.max(...E.clusters.slice(0,25).map(x=>x.n)),'#4e79a7',c.n)+'</td><td style="font-size:12px">'+esc(c.countries.join(', '))+'</td><td>'+esc(Object.entries(c.lineages).map(x=>x[0]+'×'+x[1]).join(' '))+'</td><td class="nw">'+esc(c.first)+' ~ '+esc(c.last)+'</td><td>'+c.apobec+'/'+c.mutations.length+'</td></tr>').join('')+'</table>':'<div class="mut">없음</div>';
 h+='<div class="mut" style="margin:12px 0 6px">개별 변이 ('+E.n_mutations+'개 중 앞 '+Math.min(60,E.mutations.length)+'개, 최근에 처음 나타난 것부터)</div><table><tr><th>변이</th><th>유전자</th><th>유전체</th><th>나라</th><th>lineage</th><th>첫 ~ 마지막</th><th></th></tr>'+E.mutations.slice(0,60).map(m=>'<tr><td class="nw"><b>'+esc(m.ref+m.pos+m.alt)+'</b>'+(m.apobec?' <span style="color:#d6249f">●</span>':'')+'</td><td>'+esc(m.gene)+' '+esc(m.aa)+' <span class="mut">'+esc(m.effect)+'</span></td><td>'+bar(m.n,Math.max(...E.mutations.slice(0,60).map(x=>x.n)),'#4e79a7',m.n)+'</td><td style="font-size:12px">'+esc(m.countries.join(', '))+'</td><td>'+esc(Object.entries(m.lineages).map(x=>x[0]+'×'+x[1]).join(' '))+'</td><td class="nw">'+esc(m.first)+' ~ '+esc(m.last)+'</td><td>'+(m.recent?'<b style="color:var(--bad)">최근</b>':'')+'</td></tr>').join('')+'</table>';
 h+='<h3>3. lineage별 시그니처 변이</h3><div class="help">lineage(와 그 하위 lineage)의 유전체 <b>'+pc(S.inside)+'</b> 이상이 가지고 나머지의 <b>'+pc(S.outside)+'</b> 이하만 가진 변이를 모아, 공식 정의 변이와 비교합니다. 공식 정의 변이의 보유율은 NC_063383.1 기준 정렬로 셉니다(N·결손은 미보유). 정의가 얇은 하위 lineage일수록 시그니처가 적게 나옵니다.</div>';
 h+='<table><tr><th>outbreak</th><th>lineage</th><th>유전체(하위 포함)</th><th>데이터의 시그니처 변이</th><th>APOBEC3형</th><th>공식 정의 변이 (보유율, 괄호는 N·결손으로 알 수 없는 비율)</th><th>정의 변이를 전부 가진 유전체 (자기 lineage, 위치가 모두 확인된 것 기준)</th><th>치환 종류</th><th>주요 유전자</th></tr>'+S.lineages.map(l=>'<tr><td>'+esc(l.outbreak)+'</td><td><b>'+esc(l.lineage)+'</b></td><td>'+l.n+(l.n!==l.own_n?' <span class="mut">(자체 '+l.own_n+')</span>':'')+'</td><td title="'+esc(l.signature.join(' '))+'">'+bar(l.signature_sites,Math.max(1,...S.lineages.map(x=>x.signature_sites)),'#59a14f',l.signature_sites)+'</td><td>'+(l.apobec_share==null?'-':bar(l.apobec_share,1,'#d6249f',pc(l.apobec_share)))+'</td><td style="font-size:12px">'+(l.official.length?l.official.map(o=>'<span style="font-weight:'+(o.in_signature?700:400)+'">'+esc(o.snp)+' ('+(o.carried==null?'좌표 변환 불가':pc(o.carried))+(o.unknown?', 알 수 없음 '+pc(o.unknown):'')+')</span>').join('<br>'):'<span class="mut">정의 없음</span>')+'</td><td style="font-size:12px">'+(l.concordance?l.concordance.carry_all+' / '+l.concordance.all_sites_known+' ('+pc(l.concordance.all_sites_known?l.concordance.carry_all/l.concordance.all_sites_known:null)+')'+(l.concordance.with_unknown?' <span class="mut">· 확인 불가 '+l.concordance.with_unknown+'</span>':''):'<span class="mut">-</span>')+'</td><td style="font-size:12px">'+esc(Object.entries(l.types).map(x=>x[0]+'×'+x[1]).join(' '))+'</td><td style="font-size:12px">'+esc(Object.entries(l.genes).map(x=>x[0]+'×'+x[1]).join(' '))+'</td></tr>').join('')+'</table>';

 // 4 origin
 const O=D.origin;if(O){h+='<h3 style="margin-top:22px">4. APOBEC3에 의한 변이 대 그 외(배경) 변이 <span class="mut" style="font-size:12.5px;font-weight:400">얼마나 관측되는가</span></h3><div class="help">APOBEC3형 = G→A(뒤가 A, GA&gt;AA) 또는 C→T(앞이 T, TC&gt;TT). <b>그 외</b>는 DNA 중합효소 오류·다른 탈아미노화 효소·재조합 등이 섞인 배경 변이(같은 문맥 규칙으로 가른 것일 뿐, "자연 변이"라고 단정할 수는 없습니다). 유전체마다 더하면 한 조상 변이가 후손 수만큼 중복되므로, <b>독립적인 돌연변이 사건</b>(트리의 가지마다 한 번, 또는 한 유전체에만 있는 변이)으로 셉니다. ITR 제외.</div>';
  const bars=(g,label)=>{const t=g.n||1,seg=[['apobec_TC','#d6249f','APOBEC3 TC>TT'],['apobec_GA','#f08fc6','APOBEC3 GA>AA'],['other_CT_GA','#4e79a7','그 외 C→T/G→A'],['other_transition','#76b7b2','그 외 전이(A↔G, T↔C)'],['transversion','#bab0ac','전환(transversion)']];
   return '<tr><td style="white-space:nowrap"><b>'+label+'</b><div class="mut">'+g.n.toLocaleString()+'건</div></td><td style="width:62%"><div style="display:flex;height:18px;border-radius:3px;overflow:hidden">'+seg.map(x=>'<span title="'+x[2]+' '+g[x[0]]+'건" style="background:'+x[1]+';width:'+(g[x[0]]/t*100)+'%"></span>').join('')+'</div></td><td style="font-size:12px">APOBEC3형 <b>'+pc(g.apobec_share)+'</b> ('+g.apobec+') · 그 외 '+pc(g.background_share)+' ('+(g.n-g.apobec)+')</td></tr>'};
  if(O.branches){const G=O.branches.groups;h+='<div class="card"><b>① 트리의 독립 사건</b> (가지마다 한 번) <span class="mut">'+['■ <span style="color:#d6249f">APOBEC3 TC&gt;TT</span>','■ <span style="color:#f08fc6">APOBEC3 GA&gt;AA</span>','■ <span style="color:#4e79a7">그 외 C→T/G→A</span>','■ <span style="color:#76b7b2">그 외 전이</span>','■ <span style="color:#bab0ac">transversion</span>'].join(' &nbsp; ')+'</span><table style="margin-top:6px">'+bars(G.all,'전체')+bars(G.internal,'안쪽 가지(물려받음)')+bars(G.terminal,'끝 가지(그 유전체만)')+'</table></div>';
   const E=G.all.enrichment,EC=G.all.enrichment_C,EG=G.all.enrichment_G;
