# GenomeCurator: one command to build the environment (conda or mamba):
#   mamba env create -f environment.yml && mamba activate genomecurator
name: genomecurator
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - fastapi>=0.110
  - uvicorn>=0.29
  - jinja2>=3.1
  - httpx>=0.27
  - apscheduler>=3.10,<4
  - python-multipart>=0.0.9
  - openpyxl>=3.1         # spreadsheet (.xlsx) upload and template for private genomes
  - nextclade>=3          # clade/lineage and sequence QC (QC tab); optional at runtime, sequence statistics work without it
  - pytest>=8
  - pip:
      - -e .
