# GenomeCurator: one command to build the environment (conda or mamba):
#   mamba env create -f environment.yml && mamba activate genomecurator
name: genomecurator
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - fastapi>=0.110
  - uvicorn>=0.29
  - jinja2>=3.1
  - httpx>=0.27
  - apscheduler>=3.10,<4
  - python-multipart>=0.0.9
  - pytest>=8
  - pip:
      - -e .
