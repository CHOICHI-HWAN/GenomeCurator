[project]
name = "genomecurator"
dynamic = ["version"]
description = "Local web tool to collect, check and curate virus genomes (Pathoplexus > NCBI Virus > BV-BRC)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# only for scripts/demo (recording the README GIFs): drives a headless Chrome and assembles the GIFs
demo = ["pillow>=10", "websocket-client>=1.6"]

[project.scripts]
genomecurator = "genomecurator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "genomecurator.__version__"}

[tool.setuptools.packages.find]
include = ["genomecurator*"]

[tool.setuptools.package-data]
genomecurator = ["templates/*.html"]
